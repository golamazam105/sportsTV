name: ⏱️ Automated Sports M3U Compiler

on:
  schedule:
    - cron: '*/10 * * * *' # প্রতি ১০ মিনিটে অটো-রান হবে
  workflow_dispatch: # ম্যানুয়ালি রান করার বাটন

jobs:
  build-and-sync:
    runs-on: ubuntu-latest

    steps:
    - name: 🚀 Checkout Repository Codes
      uses: actions/checkout@v4

    - name: 🐍 Setup Python Environment
      uses: actions/setup-python@v5
      with:
        python-version: '3.11' # টাইপো ফিক্সড এবং লেটেস্ট পাইথন সেট করা হলো

    - name: 📦 Install Necessary Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install requests

    - name: ⚙️ Execute Sports Compiler Engine
      run: python compiler.py

    - name: 🔄 Push Updated M3U to Repository
      run: |
        git config --local user.email "actions@github.com"
        git config --local user.name "GitHub Actions"
        git add live_sports.m3u
        git diff --cached --quiet || (git commit -m "🔄 Live Sports Engine Auto-Sync [Skip CI]" && git push https://${{ secrets.GH_TOKEN }}@github.com/${{ github.repository }}.git HEAD:main)
