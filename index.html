<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Cricfy TV - Live Sports Engine</title>
  <meta name="referrer" content="no-referrer">
  
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
  
  <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

  <style>
    /* -----------------------------------------------------------
       CRICFY APP PREMIUM INTERFACE (MOBILE-FIRST ARCHITECTURE)
    ----------------------------------------------------------- */
    :root {
      --app-bg: #090a0f;
      --card-bg: #12141c;
      --accent-color: #00ff88; /* Cricfy Neon Green */
      --text-main: #ffffff;
      --text-muted: #7e8494;
      --player-border: #1a1d29;
    }

    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body {
      margin: 0; padding: 0; background-color: var(--app-bg); color: var(--text-main);
      font-family: 'Poppins', sans-serif; overflow-x: hidden; user-select: none;
    }

    /* App Shell Header */
    .app-header {
      display: flex; align-items: center; justify-content: space-between;
      padding: 15px 20px; background: #0e1017; border-bottom: 1px solid #171a26;
      position: sticky; top: 0; z-index: 100;
    }
    .app-logo { display: flex; align-items: center; gap: 8px; font-weight: 700; font-size: 20px; color: var(--accent-color); }
    .app-logo i { font-size: 26px; }
    .search-toggle { color: var(--text-main); cursor: pointer; }

    /* Live Video Stage */
    .video-stage {
      width: 100%; max-width: 960px; margin: 0 auto; background: #000000;
      position: sticky; top: 58px; z-index: 99; box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }
    .aspect-ratio-box { position: relative; width: 100%; padding-top: 56.25%; /* 16:9 */ }
    #video-player { position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: contain; }

    /* Cricfy Dynamic Multi-Server Panel */
    .server-control-panel {
      max-width: 960px; margin: 12px auto; padding: 0 15px; display: none;
    }
    .server-panel-inner {
      background: var(--card-bg); border-radius: 12px; padding: 12px; border: 1px solid #1c202e;
    }
    .server-label {
      font-size: 11px; color: var(--text-muted); font-weight: 700;
      text-transform: uppercase; letter-spacing: 1px; margin-bottom: 8px;
      display: flex; align-items: center; gap: 5px;
    }
    .server-label i { font-size: 14px; color: var(--accent-color); }
    .server-grid { display: flex; gap: 8px; flex-wrap: wrap; }
    
    .server-tab {
      background: #1a1d29; color: #cbd5e1; border: 1px solid #252a3d;
      padding: 8px 18px; font-size: 13px; font-weight: 600; border-radius: 8px;
      cursor: pointer; transition: all 0.2s ease; display: flex; align-items: center; gap: 6px;
    }
    .server-tab.active {
      background: linear-gradient(135deg, #00ff88, #00b359); color: #000000;
      border-color: var(--accent-color); box-shadow: 0 4px 12px rgba(0,255,136,0.25);
    }

    /* Core Content Container */
    .app-container { max-width: 960px; margin: 0 auto; padding: 15px; }

    /* App Floating Search Bar */
    .search-wrapper { margin-bottom: 15px; display: none; }
    .search-wrapper.active { display: block; animation: slideDown 0.2s ease; }
    .search-box {
      display: flex; align-items: center; background: var(--card-bg);
      border-radius: 50px; padding: 0 15px; border: 1px solid #1c202e;
    }
    .search-box i { color: var(--text-muted); }
    #search-input {
      width: 100%; background: transparent; border: none; padding: 12px 10px;
      color: #fff; font-size: 15px; font-family: inherit;
    }
    #search-input:focus { outline: none; }

    /* Dynamic Horizontal Category Slider */
    .category-scroller {
      display: flex; gap: 8px; overflow-x: auto; padding-bottom: 12px;
      scrollbar-width: none; -webkit-overflow-scrolling: touch;
    }
    .category-scroller::-webkit-scrollbar { display: none; }
    
    .category-pill {
      background: var(--card-bg); color: var(--text-muted); border: 1px solid #1c202e;
      padding: 10px 20px; border-radius: 50px; cursor: pointer; font-weight: 600;
      font-size: 13px; white-space: nowrap; transition: all 0.2s ease;
    }
    .category-pill.active {
      background: #1c2e24; color: var(--accent-color); border-color: var(--accent-color);
    }

    /* Cricfy Channel App Grid Layout */
    .channels-section-title {
      font-size: 15px; font-weight: 600; margin: 10px 0 15px 2px;
      color: #f1f5f9; display: flex; align-items: center; gap: 6px;
    }
    .channels-grid {
      display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px;
    }
    @media (min-width: 600px) {
      .channels-grid { grid-template-columns: repeat(4, 1fr); }
    }
    @media (min-width: 900px) {
      .channels-grid { grid-template-columns: repeat(6, 1fr); }
    }

    /* Premium Cricfy Channel Item Elements */
    .channel-item {
      background: var(--card-bg); border-radius: 14px; padding: 15px 10px;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 10px; cursor: pointer; border: 1px solid #1c202e; transition: all 0.2s ease;
      position: relative; overflow: hidden; min-height: 115px;
    }
    .channel-item:active, .channel-item:hover {
      transform: scale(0.96); border-color: var(--accent-color); background: #171924;
    }
    .channel-item.active {
      background: #112219; border-color: var(--accent-color);
    }
    
    .logo-container {
      width: 50px; height: 50px; display: flex; align-items: center; justify-content: center;
      background: #1a1d29; border-radius: 50px; padding: 5px; box-shadow: inset 0 0 10px rgba(0,0,0,0.3);
    }
    .channel-item img { max-width: 100%; max-height: 100%; object-fit: contain; }
    .channel-title {
      font-size: 12px; font-weight: 600; text-align: center; color: #e2e8f0;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis; width: 100%;
    }

    /* Pulse Live Badge Indicator */
    .live-badge {
      position: absolute; top: 6px; right: 6px; display: flex; align-items: center; gap: 3px;
      background: rgba(239, 68, 68, 0.15); padding: 2px 6px; border-radius: 4px;
      border: 1px solid rgba(239, 68, 68, 0.3);
    }
    .pulse-dot {
      width: 5px; height: 5px; background-color: #ef4444; border-radius: 50px;
      animation: pulse 1.2s infinite;
    }
    .live-text { font-size: 8px; font-weight: 900; color: #ef4444; letter-spacing: 0.5px; }

    @keyframes pulse {
      0% { transform: scale(0.8); opacity: 0.5; }
      50% { transform: scale(1.2); opacity: 1; }
      100% { transform: scale(0.8); opacity: 0.5; }
    }
    @keyframes slideDown {
      from { opacity: 0; transform: translateY(-10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* Global Sync Floating Button */
    .app-sync-fab {
      position: fixed; bottom: 20px; right: 20px; background: linear-gradient(135deg, #00ff88, #00b359);
      color: #000; width: 50px; height: 50px; border-radius: 50px; display: flex;
      align-items: center; justify-content: center; cursor: pointer; z-index: 101;
      box-shadow: 0 4px 15px rgba(0,255,136,0.4); transition: 0.2s;
    }
    .app-sync-fab:active { transform: scale(0.9); }
  </style>
</head>
<body>

  <header class="app-header">
    <div class="app-logo">
      <i class="material-icons">lens_blur</i>
      <span>CRICFY TV</span>
    </div>
    <div class="search-toggle" id="toggle-search-btn">
      <i class="material-icons">search</i>
    </div>
  </header>

  <section class="video-stage">
    <div class="aspect-ratio-box">
      <video id="video-player" autoplay controls poster="https://i.imgur.com/vDUIunw.png"></video>
    </div>
  </section>

  <section class="server-control-panel" id="server-switcher-panel">
    <div class="server-panel-inner">
      <div class="server-label">
        <i class="material-icons">bolt</i>
        <span>চ্যানেল সার্ভারসমূহ (বাফারিং এড়াতে সার্ভার পরিবর্তন করুন)</span>
      </div>
      <div class="server-grid" id="server-buttons-container"></div>
    </div>
  </section>

  <main class="app-container">
    
    <div class="search-wrapper" id="search-bar-area">
      <div class="search-box">
        <i class="material-icons">search</i>
        <input type="text" id="search-input" placeholder="চ্যানেলের নাম দিয়ে সার্চ করুন...">
      </div>
    </div>

    <div class="category-scroller" id="category-slider"></div>

    <h2 class="channels-section-title">
      <i class="material-icons" style="color: #ef4444; font-size: 18px;">live_tv</i>
      <span>লাইভ টিভি চ্যানেলসমূহ</span>
    </h2>
    <div class="channels-grid" id="channels-view">
      <div style="grid-column: 1/-1; text-align: center; color: var(--text-muted); padding: 40px 0;">
        ক্রিকফাই ইঞ্জিন ডাটা লোড করছে...
      </div>
    </div>
  </main>

  <div class="app-sync-fab" id="fab-sync-trigger" title="রিলিজ ডাটা সিঙ্ক করুন">
    <i class="material-icons">sync</i>
  </div>

  <script type="text/javascript">
    (function() {
      const coreConfig = {
        sourceUrl: './live_sports.m3u',
        defaultLogo: 'https://i.imgur.com/Q5Z4y7T.png'
      };

      let appDatabase = {};
      let categories = ['All'];
      let selectedCategory = 'All';
      let activeHlsInstance = null;

      async function bootCricfyEngine() {
        const view = document.getElementById('channels-view');
        try {
          const timestamp = new Date().getTime();
          const response = await fetch(coreConfig.sourceUrl + '?v=' + timestamp);
          if (!response.ok) throw new Error();
          const m3uContent = await response.text();
          
          parseM3UDataStructure(m3uContent);
          renderCategorySlider();
          filterAndRenderChannels();
        } catch (e) {
          view.innerHTML = '<div style="grid-column:1/-1;text-align:center;color:#ef4444;font-weight:600;padding:30px;">❌ ডাটা রেন্ডারিং ব্যর্থ হয়েছে! গিটহাব অ্যাকশনস সাকসেস হয়েছে কি না নিশ্চিত করুন।</div>';
        }
      }

      function parseM3UDataStructure(text) {
        const rows = text.split('\n');
        appDatabase = {};
        const uniqueCategories = new Set();
        let trackMeta = null;

        for (let i = 0; i < rows.length; i++) {
          let row = rows[i].trim();
          if (row.startsWith('#EXTINF:')) {
            trackMeta = {};
            const logo = row.match(/tvg-logo="([^"]+)"/);
            const group = row.match(/group-title="([^"]+)"/);
            const commaSep = row.lastIndexOf(',');
            let rawTitle = commaSep !== -1 ? row.substring(commaSep + 1).trim() : 'Live Stream';
            
            // ক্রিকফাই এক্সক্লুসিভ মাল্টি-সার্ভার ডেসিমাল স্প্লিটার
            let cleanChannelName = rawTitle;
            let serverLabel = 'Server 1';
            const serverRegex = /(.*)\s\((Server\s\d+)\)/i;
            const matchResult = rawTitle.match(serverRegex);
            
            if (matchResult) {
              cleanChannelName = matchResult[1].trim();
              serverLabel = matchResult[2].trim();
            }

            trackMeta.name = cleanChannelName;
            trackMeta.server = serverLabel;
            trackMeta.logo = logo ? logo[1] : coreConfig.defaultLogo;
            trackMeta.category = group ? group[1] : 'Live Sports';
            
            uniqueCategories.add(trackMeta.category);
          } else if (row && !row.startsWith('#')) {
            if (trackMeta) {
              trackMeta.url = row;
              
              if (!appDatabase[trackMeta.name]) {
                appDatabase[trackMeta.name] = {
                  logo: trackMeta.logo,
                  category: trackMeta.category,
                  streams: []
                };
              }
              appDatabase[trackMeta.name].streams.push({
                label: trackMeta.server,
                link: trackMeta.url
              });
              trackMeta = null;
            }
          }
        }
        categories = ['All', ...Array.from(uniqueCategories)];
      }

      function renderCategorySlider() {
        const slider = document.getElementById('category-slider');
        if (!slider) return;
        slider.innerHTML = '';
        
        categories.forEach(cat => {
          const pill = document.createElement('div');
          pill.className = `category-pill ${cat === selectedCategory ? 'active' : ''}`;
          pill.innerText = cat;
          pill.onclick = function() {
            selectedCategory = cat;
            slider.querySelectorAll('.category-pill').forEach(p => p.classList.remove('active'));
            pill.classList.add('active');
            filterAndRenderChannels();
          };
          slider.appendChild(pill);
        });
      }

      function filterAndRenderChannels() {
        const view = document.getElementById('channels-view');
        const searchInput = document.getElementById('search-input');
        const query = searchInput ? searchInput.value.toLowerCase() : '';
        
        if (!view) return;
        view.innerHTML = '';

        const allKeys = Object.keys(appDatabase);
        let matchesFound = 0;

        allKeys.forEach(channelName => {
          const channelNode = appDatabase[channelName];
          
          if (selectedCategory !== 'All' && channelNode.category !== selectedCategory) return;
          if (channelName.toLowerCase().indexOf(query) === -1) return;

          matchesFound++;
          
          const item = document.createElement('div');
          item.className = 'channel-item';
          
          item.innerHTML = `
            <div class="live-badge">
              <div class="pulse-dot"></div>
              <div class="live-text">LIVE</div>
            </div>
            <div class="logo-container">
              <img src="${channelNode.logo}" onerror="this.src='${coreConfig.defaultLogo}'" alt="logo">
            </div>
            <div class="channel-title">${channelName}</div>
          `;

          item.onclick = function() {
            view.querySelectorAll('.channel-item').forEach(el => el.classList.remove('active'));
            item.classList.add('active');
            triggerCricfySwitcher(channelName, channelNode.streams);
          };

          view.appendChild(item);
        });

        if (matchesFound === 0) {
          view.innerHTML = '<div style="grid-column:1/-1;text-align:center;color:var(--text-muted);padding:30px;">কোনো চ্যানেল পাওয়া যায়নি।</div>';
        }
      }

      function triggerCricfySwitcher(name, streams) {
        const panel = document.getElementById('server-switcher-panel');
        const container = document.getElementById('server-buttons-container');
        if (!panel || !container) return;

        container.innerHTML = '';
        streams.sort((a, b) => a.label.localeCompare(b.label, undefined, {numeric: true}));

        streams.forEach((stream, index) => {
          const btn = document.createElement('button');
          btn.className = 'server-tab';
          btn.innerHTML = `<i class="material-icons" style="font-size:14px;">play_circle</i> ${stream.label}`;
          
          btn.onclick = function() {
            container.querySelectorAll('.server-tab').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            fireNativePlayer(stream.link);
          };

          container.appendChild(btn);
          if (index === 0) {
            btn.classList.add('active');
            fireNativePlayer(stream.link);
          }
        });

        panel.style.display = 'block';
      }

      function fireNativePlayer(url) {
        const video = document.getElementById('video-player');
        if (!video) return;

        if (activeHlsInstance) {
          activeHlsInstance.destroy();
          activeHlsInstance = null;
        }

        if (window.Hls && window.Hls.isSupported()) {
          activeHlsInstance = new window.Hls();
          activeHlsInstance.loadSource(url);
          activeHlsInstance.attachMedia(video);
          activeHlsInstance.on(window.Hls.Events.MANIFEST_PARSED, function() {
            video.play().catch(() => {});
          });
        } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
          video.src = url;
          video.play().catch(() => {});
        }

        window.scrollTo({ top: 0, behavior: 'smooth' });
      }

      // Event Triggers
      document.addEventListener('DOMContentLoaded', () => {
        bootCricfyEngine();

        document.getElementById('toggle-search-btn').addEventListener('click', () => {
          const bar = document.getElementById('search-bar-area');
          bar.classList.toggle('active');
          if(bar.classList.contains('active')) document.getElementById('search-input').focus();
        });

        document.getElementById('search-input').addEventListener('input', () => filterAndRenderChannels());
        document.getElementById('fab-sync-trigger').addEventListener('click', () => bootCricfyEngine());
      });

    })();
  </script>
</body>
</html>
